<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RAG Chatbot</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #f6f7f9; color: #1a1a1a;
    display: flex; flex-direction: column; height: 100vh;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1b1e; color: #e8e8e8; }
    header, footer { background: #25262b !important; border-color: #333 !important; }
    .msg.bot { background: #2b2d31 !important; }
    input, button { background: #2b2d31; color: inherit; border-color: #444 !important; }
  }
  header, footer {
    padding: 12px 16px; background: #fff; border-bottom: 1px solid #e2e2e2;
    display: flex; gap: 10px; align-items: center;
  }
  footer { border-top: 1px solid #e2e2e2; border-bottom: none; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #log { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 680px; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: #2563eb; color: #fff; }
  .msg.bot { align-self: flex-start; background: #fff; border: 1px solid #e2e2e2; }
  .msg.note { align-self: center; font-size: 13px; opacity: .7; }
  .sources { font-size: 12px; opacity: .65; margin-top: 6px; }
  input[type=text] { flex: 1; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font: inherit; }
  button { padding: 9px 16px; border: 1px solid #ccc; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; font: inherit; }
  button.secondary { background: transparent; color: inherit; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
  <header>
    <h1>RAG Chatbot</h1>
    <button class="secondary" id="uploadBtn">Upload file</button>
    <input type="file" id="file" accept=".txt,.md,.pdf,.csv,.json,.log" hidden />
  </header>

  <div id="log">
    <div class="msg note">Upload a document, then ask questions about it.</div>
  </div>

  <footer>
    <input type="text" id="q" placeholder="Ask a question..." autocomplete="off" />
    <button id="send">Send</button>
  </footer>

<script>
const log = document.getElementById("log");
const q = document.getElementById("q");
const send = document.getElementById("send");
const fileInput = document.getElementById("file");
const history = [];

function add(role, text, sources) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  if (sources && sources.length) {
    const s = document.createElement("div");
    s.className = "sources";
    s.textContent = "Sources: " + sources.join(", ");
    div.appendChild(s);
  }
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

document.getElementById("uploadBtn").onclick = () => fileInput.click();

fileInput.onchange = async () => {
  const f = fileInput.files[0];
  if (!f) return;
  const note = add("note", `Uploading ${f.name}...`);
  const body = new FormData();
  body.append("file", f);
  try {
    const r = await fetch("/upload", { method: "POST", body });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || "upload failed");
    note.textContent = `Indexed ${f.name} (${d.chunks} chunks)`;
  } catch (e) {
    note.textContent = `Upload failed: ${e.message}`;
  }
  fileInput.value = "";
};

async function ask() {
  const text = q.value.trim();
  if (!text) return;
  q.value = "";
  add("user", text);
  history.push({ role: "user", content: text });
  send.disabled = true;
  const pending = add("bot", "...");
  try {
    const r = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || "request failed");
    pending.textContent = d.reply;
    if (d.sources && d.sources.length) {
      const s = document.createElement("div");
      s.className = "sources";
      s.textContent = "Sources: " + d.sources.join(", ");
      pending.appendChild(s);
    }
    history.push({ role: "assistant", content: d.reply });
  } catch (e) {
    pending.textContent = "Error: " + e.message;
  }
  send.disabled = false;
  q.focus();
}

send.onclick = ask;
q.addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });
</script>
</body>
</html>
